<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Garden Control System</h1>
    <button onclick="location.href='firebase_alarms.html'">Görevler</button>
    <button onclick="location.href='relays.html'">Vanalar</button>
    <button onclick="location.href='firebase_relay_logs.html'">Relay Logs</button>
    <button onclick="location.href='firebase_ping.html'">Ping</button>
    <button onclick="location.href='pressure.html'">Basınç</button>
    <br>
    <button onclick="sendCommand(-3, 'Saat internetten güncelleniyor')">Saati İnternetten Güncelle</button>
    <button onclick="if (confirm('Cihaz resetlensin mi?')) sendCommand(-2, 'Reset komutu')">Reset</button>
    <div id="status"></div>
    <script>
        function sendCommand(command, label) {
            const status = document.getElementById("status");
            fetch("/api/command", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command })
            })
                .then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    status.style.color = "#166534";
                    status.textContent = `${label}: gönderildi (Params/Command=${command})`;
                })
                .catch(() => {
                    status.style.color = "#b91c1c";
                    status.textContent = `${label}: gönderilemedi`;
                });
        }
    </script>
</body>
</html>
