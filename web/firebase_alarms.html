<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Alarm Parameters</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #f4f4f9;
            box-sizing: border-box;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 1100px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }


        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            table {
                min-width: 900px;
            }

            th, td {
                padding: 6px;
                font-size: 12px;
            }

            #paramsContainer {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Alarm No</th>
                    <th>Status</th>
                    <th>Frequency</th>
                    <th>Start Time</th>
                    <th>Run Minutes</th>
                    <th>Idle Minutes</th>
                    <th>Repeat Count</th>
                    <th>Remaining Repeat Count</th>
                    <th>Remaining Run Time</th>
                    <th>Remaining Idle Time</th>
                    <th>Last Run Date</th>
                    <th>Relay No</th>
                </tr>
            </thead>
            <tbody id="alarmTableBody">
                <!-- Rows will be dynamically populated -->
            </tbody>
        </table>
    </div>

<script>

    async function fetchAlarmData() {

        const tableBody =
            document.getElementById("alarmTableBody");

        tableBody.innerHTML = "";

        try {

            const response =
                await fetch('/api/alarms');

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const result =
                await response.json();

            if (!result.ok) {
                throw new Error(
                    "API returned an error"
                );
            }

            const alarms =
                result.alarms || {};

            const relays =
                result.relays || {};


            /*
             * Alarm0, Alarm1, Alarm2...
             * şeklinde numerik sırala.
             */
            const sortedAlarms =
                Object.entries(alarms)
                    .sort(([a], [b]) => {

                        const noA =
                            parseInt(
                                a.replace(/\D/g, ''),
                                10
                            );

                        const noB =
                            parseInt(
                                b.replace(/\D/g, ''),
                                10
                            );

                        return noA - noB;
                    });


            for (
                const [alarmKey, alarm]
                of sortedAlarms
            ) {

                const row =
                    document.createElement("tr");


                addCell(
                    row,
                    alarmKey
                );

                addCell(
                    row,
                    mapStatus(
                        alarm.alarm_status
                    )
                );

                addCell(
                    row,
                    mapFrequency(
                        alarm.day_period
                    )
                );

                addCell(
                    row,
                    formatTime(
                        alarm.alarm_hour,
                        alarm.alarm_minute
                    )
                );

                addCell(
                    row,
                    valueOrNA(
                        alarm.run_minutes
                    )
                );

                addCell(
                    row,
                    valueOrNA(
                        alarm.idle_minutes
                    )
                );

                addCell(
                    row,
                    valueOrNA(
                        alarm.repeat_count
                    )
                );

                addCell(
                    row,
                    valueOrNA(
                        alarm.repeat_count_remaining
                    )
                );

                addCell(
                    row,
                    formatMinutes(
                        alarm.run_remaining_minutes
                    )
                );

                addCell(
                    row,
                    formatMinutes(
                        alarm.idle_remaining_minutes
                    )
                );

                addCell(
                    row,
                    formatDate(
                        alarm.last_run_date
                    )
                );

                addCell(
                    row,
                    formatRelayDisplay(
                        alarm.relay_no,
                        relays
                    )
                );


                /*
                 * Edit sayfasına giderken
                 * Alarm0 / Alarm1 / Alarm2 anahtarını gönder.
                 */
                row.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            `firebase_edit_alarm.html?alarmNo=${encodeURIComponent(alarmKey)}`;
                    }
                );


                tableBody.appendChild(row);
            }

        }
        catch (error) {

            console.error(
                "Alarm loading error:",
                error
            );

            const row =
                document.createElement("tr");

            const cell =
                document.createElement("td");

            cell.colSpan = 12;

            cell.textContent =
                "Error loading alarms: " +
                error.message;

            cell.style.color = "#dc3545";

            row.appendChild(cell);

            tableBody.appendChild(row);
        }
    }


    function formatRelayDisplay(relayNo, relays) {

        if (
            relayNo === undefined ||
            relayNo === null
        ) {
            return "N/A";
        }

        const no =
            parseInt(relayNo, 10);

        if (Number.isNaN(no)) {
            return String(relayNo);
        }

        /*
        * Alarm relay_no = 1 ise
        * Firebase'de relay0 kullanılıyor.
        */
        const relayKey =
            `relay${no - 1}`;

        const relay =
            relays[relayKey];

        const description =
            getRelayDescription(relay);

        return description
            ? `${no} (${description})`
            : String(no);
    }


    function getRelayDescription(relay) {

        if (
            relay === undefined ||
            relay === null
        ) {
            return "";
        }

        /*
        * relay0: "Domates, Biber"
        */
        if (
            typeof relay === "string" ||
            typeof relay === "number"
        ) {
            return String(relay);
        }

        /*
        * relay0: ["Domates", "Biber"]
        */
        if (Array.isArray(relay)) {
            return relay.join(", ");
        }

        /*
        * relay0: {
        *     description: "Domates, Biber"
        * }
        */
        if (typeof relay === "object") {

            return (
                relay.plants ||
                relay.name ||
                relay.description ||
                relay.label ||
                relay.title ||
                ""
            );
        }

        return "";
    }


    function addCell(row, value) {

        const cell =
            document.createElement("td");

        cell.textContent =
            value ?? "N/A";

        row.appendChild(cell);
    }


    function valueOrNA(value) {

        return (
            value === undefined ||
            value === null ||
            value === ""
        )
            ? "N/A"
            : value;
    }


    function formatMinutes(value) {

        return (
            value === undefined ||
            value === null
        )
            ? "N/A"
            : `${value} min`;
    }


    function mapStatus(status) {

        switch (status) {

            case 0:
                return "Stopped";

            case 1:
                return "Running";

            case 2:
                return "Waiting";

            default:
                return "Unknown";
        }
    }


    function mapFrequency(dayPeriod) {

        switch (dayPeriod) {

            case 0:
                return "Off";

            case 1:
                return "Everyday";

            case 2:
                return "Day After";

            case 3:
                return "Two Days After";

            default:
                return `${dayPeriod} Days`;
        }
    }


    function formatTime(hour, minute) {

        if (
            hour === undefined ||
            minute === undefined
        ) {
            return "N/A";
        }

        return (
            `${String(hour).padStart(2, '0')}:` +
            `${String(minute).padStart(2, '0')}`
        );
    }


    function formatDate(value) {

        if (!value) {
            return "N/A";
        }

        const parts =
            String(value).split("-");

        if (parts.length !== 3) {
            return value;
        }

        return (
            `${parts[2]}/` +
            `${parts[1]}/` +
            `${parts[0]}`
        );
    }


    window.onload =
        fetchAlarmData;

</script>
</body>
</html>
