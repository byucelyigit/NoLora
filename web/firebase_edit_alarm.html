<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Alarm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        form {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007BFF;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Edit Alarm v2</h1>
    <form id="editAlarmForm">
        <label for="alarmStatus">Status</label>
        <select id="alarmStatus">
            <option value="0">Stopped</option>
            <option value="1">Running</option>
            <option value="2">Waiting</option>
        </select>

        <label for="dayPeriod">Frequency</label>
        <select id="dayPeriod">
            <option value="0">Off</option>
            <option value="1">Everyday</option>
            <option value="2">Day After</option>
            <option value="3">Two Days After</option>
        </select>

        <label for="alarmHour">Start Hour</label>
        <input type="number" id="alarmHour" min="0" max="23">

        <label for="alarmMinute">Start Minute</label>
        <input type="number" id="alarmMinute" min="0" max="59">

        <label for="runMinutes">Run Minutes</label>
        <input type="number" id="runMinutes" min="0">

        <label for="idleMinutes">Idle Minutes</label>
        <input type="number" id="idleMinutes" min="0">

        <label for="repeatCount">Repeat Count</label>
        <input type="number" id="repeatCount" min="0">

        <label for="repeatCountRemaining">Remaining Repeat Count</label>
        <input type="number" id="repeatCountRemaining" min="0">

        <label for="runRemainingMinutes">Remaining Run Time (minutes)</label>
        <input type="number" id="runRemainingMinutes" min="0">

        <label for="idleRemainingMinutes">Remaining Idle Time (minutes)</label>
        <input type="number" id="idleRemainingMinutes" min="0">

        <label for="lastRunDate">Last Run Date</label>
        <input type="date" id="lastRunDate">

        <label for="relayNo">Relay No</label>
        <input type="number" id="relayNo" min="0">

        <button type="button" id="saveButton">Save</button>
    </form>

    <script>

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const alarmNo =
        urlParams.get("alarmNo");


    /*
     * Alarm oku
     */
    async function fetchAlarmDetails() {

        try {

            const response =
                await fetch(
                    `/api/alarm?alarmNo=${encodeURIComponent(alarmNo)}`
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const result =
                await response.json();


            if (!result.ok) {

                throw new Error(
                    result.error ||
                    "Unable to read alarm"
                );
            }


            const alarm =
                result.alarm;


            document.getElementById(
                "alarmStatus"
            ).value =
                alarm.alarm_status;


            document.getElementById(
                "dayPeriod"
            ).value =
                alarm.day_period;


            document.getElementById(
                "alarmHour"
            ).value =
                alarm.alarm_hour;


            document.getElementById(
                "alarmMinute"
            ).value =
                alarm.alarm_minute;


            document.getElementById(
                "runMinutes"
            ).value =
                alarm.run_minutes;


            document.getElementById(
                "idleMinutes"
            ).value =
                alarm.idle_minutes;


            document.getElementById(
                "repeatCount"
            ).value =
                alarm.repeat_count;


            document.getElementById(
                "repeatCountRemaining"
            ).value =
                alarm.repeat_count_remaining ?? 0;


            document.getElementById(
                "runRemainingMinutes"
            ).value =
                alarm.run_remaining_minutes ?? 0;


            document.getElementById(
                "idleRemainingMinutes"
            ).value =
                alarm.idle_remaining_minutes ?? 0;


            document.getElementById(
                "lastRunDate"
            ).value =
                alarm.last_run_date || "";


            document.getElementById(
                "relayNo"
            ).value =
                alarm.relay_no ?? 0;

        }
        catch (error) {

            console.error(
                "Alarm load error:",
                error
            );

            alert(
                "Alarm bilgisi alınamadı."
            );
        }
    }


    /*
     * Alarm kaydet
     */
    async function saveAlarmDetails() {

        const updatedAlarm = {

            alarm_status:
                parseInt(
                    document.getElementById(
                        "alarmStatus"
                    ).value,
                    10
                ),

            day_period:
                parseInt(
                    document.getElementById(
                        "dayPeriod"
                    ).value,
                    10
                ),

            alarm_hour:
                parseInt(
                    document.getElementById(
                        "alarmHour"
                    ).value,
                    10
                ),

            alarm_minute:
                parseInt(
                    document.getElementById(
                        "alarmMinute"
                    ).value,
                    10
                ),

            run_minutes:
                parseInt(
                    document.getElementById(
                        "runMinutes"
                    ).value,
                    10
                ),

            idle_minutes:
                parseInt(
                    document.getElementById(
                        "idleMinutes"
                    ).value,
                    10
                ),

            repeat_count:
                parseInt(
                    document.getElementById(
                        "repeatCount"
                    ).value,
                    10
                ),

            repeat_count_remaining:
                parseInt(
                    document.getElementById(
                        "repeatCountRemaining"
                    ).value,
                    10
                ),

            run_remaining_minutes:
                parseInt(
                    document.getElementById(
                        "runRemainingMinutes"
                    ).value,
                    10
                ),

            idle_remaining_minutes:
                parseInt(
                    document.getElementById(
                        "idleRemainingMinutes"
                    ).value,
                    10
                ),

            last_run_date:
                document.getElementById(
                    "lastRunDate"
                ).value,

            relay_no:
                parseInt(
                    document.getElementById(
                        "relayNo"
                    ).value,
                    10
                )
        };


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        try {

            saveButton.disabled = true;
            saveButton.textContent =
                "Saving...";


            const response =
                await fetch(
                    `/api/alarm?alarmNo=${encodeURIComponent(alarmNo)}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                updatedAlarm
                            )
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.ok
            ) {

                throw new Error(
                    result.error ||
                    `HTTP ${response.status}`
                );
            }


            window.location.href =
                "firebase_alarms.html";

        }
        catch (error) {

            console.error(
                "Alarm save error:",
                error
            );


            alert(
                "Alarm kaydedilemedi: " +
                error.message
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save";
        }
    }


    document.getElementById(
        "saveButton"
    ).addEventListener(
        "click",
        saveAlarmDetails
    );


    if (alarmNo) {

        fetchAlarmDetails();

    } else {

        alert(
            "No alarm number provided!"
        );

        window.location.href =
            "firebase_alarms.html";
    }

</script>
</body>
</html>
